# ==============================================================================
# KONFIGURASI OPERASIONAL PENS KP BOT
# ==============================================================================

settings:
  # Mode Pengisian:
  # - 'single' : 1 kali sehari (Ideal untuk mahasiswa yang cukup 1 laporan per hari)
  # - 'dual'   : 2 kali sehari (Pagi 07:00-12:00 dan Sore 13:00-16:00)
  mode: single

  # Daftar Hari Aktif Pengisian Logbook
  # Bot hanya akan mengisi pada hari yang terdaftar di bawah ini (huruf kecil).
  # Pilihan: monday, tuesday, wednesday, thursday, friday, saturday, sunday
  active_days:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday

  # Timeout request HTTP (detik)
  request_timeout: 45

  # Cek entri portal sebelum submit untuk mencegah duplikasi (Idempotency)
  check_existing_entries: true

schedule:
  # Pengaturan jam untuk Mode 'single' (1x sehari)
  single:
    label: "Sesi Penuh"
    start_time: "08:00"
    end_time: "16:00"
    # Jam rekomendasi eksekusi penjadwal otomatis (16:15 WIB)
    trigger_time: "16:15"

  # Pengaturan jam untuk Mode 'dual' (2x sehari)
  dual:
    morning:
      label: "Sesi Pagi"
      start_time: "07:00"
      end_time: "12:00"
      trigger_time: "12:05"
    afternoon:
      label: "Sesi Sore"
      start_time: "13:00"
      end_time: "16:00"
      trigger_time: "16:05"

# ==============================================================================
# SUMBER DATA KETERANGAN / NARASI KEGIATAN LOGBOOK
# Pilih salah satu tipe sumber data di bawah:
# 1. 'bank' : Menggunakan bank template otomatis bawaan bot (TIDAK PERLU KETIK APA-APA)
# 2. 'file' : Membaca berkas teks kegiatan.txt atau kegiatan.json
# 3. 'ai'   : Membuat narasi otomatis via Google Gemini API / Groq API gratis
# 4. 'git'  : Membaca commit git lokal jika mengerjakan proyek coding
# ==============================================================================
activity_source:
  type: bank # Pilihan: bank | file | ai | git

  # Opsi untuk tipe 'file' (jika ingin mencatat draft narasi di file teks):
  file_path: "kegiatan.txt"

  # Opsi untuk tipe 'ai' (jika ingin dibuatkan AI dinamis setiap hari):
  provider: "gemini" # Pilihan: gemini | groq
  role_description: "Staf IT magang, pemeliharaan infrastruktur jaringan dan sistem web perusahaan."

  # Opsi untuk tipe 'git' (jika mengarahkan ke folder repo git lokal):
  git_repo_path: ""

company:
  name: "PT. Perusahaan Tempat KP"
  division: "Engineering & IT Operations"

# Sanitizer Kata Kunci Kampus WAF (Mencegah false positive injeksi SQL)
waf_sanitizer:
  enabled: true
  replacements:
    "&": "dan"
    "identity insert": "identity insersi"
    "insert ": "penyisipan "
    "hard delete": "penghapusan permanen"
    "soft delete": "penonaktifan lunak"
    "delete ": "penghapusan "
    "drop ": "pelepasan "
    "select ": "pemilihan "
    "union ": "penggabungan "
    "truncate ": "pengosongan "

# Bank Template Kegiatan Akademik Berdasarkan Bidang Kerja
domain_templates:
  software:
    single:
      weekday:
        - "Melakukan peninjauan struktur arsitektur kode dan implementasi modul layanan backend. Merancang penyesuaian skema relasional basis data, melakukan pengujian unit, serta memverifikasi kestabilan alur komputasi data pada lingkungan pengujian."
        - "Melakukan refaktorisasi komponen frontend dan pengikatan logika antarmuka pengguna. Menjalankan pengujian integrasi fungsional lintas layanan serta optimasi mekanisme caching untuk meningkatkan efisiensi pemrosesan transaksi."
        - "Menganalisis kebutuhan integrasi application programming interface (API) dan merancang validasi payload request. Melakukan pengujian alur interaksi pengguna secara menyeluruh dan kompilasi rilis pembaruan sistem."
    morning:
      weekday:
        - "Melakukan peninjauan struktur arsitektur kode dan analisis kebutuhan modul backend sistem. Merancang penyesuaian skema entitas basis data serta perbaikan penanganan kueri relasional untuk integrasi alur data."
        - "Melakukan peninjauan struktur data dan optimasi alur komputasi pada modul layanan backend. Mengidentifikasi kendala performa pada modul pemrosesan transaksi serta merancang mekanisme caching in-memory."
    afternoon:
      weekday:
        - "Melanjutkan implementasi lanjutan modul antarmuka pengguna dan interlock logika operasional sistem. Melakukan pengujian integrasi fungsional menyeluruh serta verifikasi kepatuhan target interaksi pengguna."
        - "Melakukan implementasi interlock proteksi kesalahan operasional dan integrasi antarmuka dashboard monitoring. Menjalankan pengujian regresi menyeluruh untuk memverifikasi keandalan sistem."

  network:
    single:
      weekday:
        - "Melakukan pemantauan topologi jaringan lokal, audit alokasi IP subnet, dan konfigurasi routing protokol switch distribusi. Melakukan pengujian beban lalu lintas data serta pemeliharaan berkala perangkat router gateway."
        - "Melakukan audit keamanan port jaringan dan pembaruan aturan firewall pada router perimeter. Menjalankan pengujian latensi jaringan end-to-end serta penanganan tiket insiden gangguan koneksi pengguna."
        - "Melakukan konfigurasi virtual local area network (VLAN) dan implementasi quality of service (QoS) untuk prioritas data penting. Melakukan verifikasi kestabilan koneksi internet pasca-penyesuaian gateway."
    morning:
      weekday:
        - "Melakukan pemantauan topologi jaringan lokal dan analisis throughput lalu lintas data pada switch distribusi. Melakukan verifikasi alokasi subnet IP serta pemeriksaan integritas konfigurasi routing."
    afternoon:
      weekday:
        - "Melakukan konfigurasi lanjutan virtual local area network (VLAN) dan implementasi quality of service (QoS) untuk prioritas lalu lintas data penting. Menjalankan uji beban koneksi dan pengukuran latensi jaringan."

  it_support:
    single:
      weekday:
        - "Melakukan penanganan tiket pemeliharaan perangkat keras komputer operasional dan instalasi sistem operasi terstandar. Melakukan konfigurasi perangkat periferal serta verifikasi konektivitas ke jaringan kantor."
        - "Melakukan pemeriksaan berkala perangkat workstation pengguna, inventarisasi aset teknologi informasi, serta pembaruan berkas tanda tangan antivirus guna menjaga keamanan data operasional kantor."
        - "Melakukan pendampingan teknis terhadap kendala operasional perangkat lunak perkantoran pengguna dan pencadangan data lokal berkala ke media penyimpanan server terpusat."
    morning:
      weekday:
        - "Melakukan pemeriksaan kesiapan perangkat workstation operasional dan inventarisasi tiket kendala teknologi informasi yang masuk pada sistem helpdesk."
    afternoon:
      weekday:
        - "Menyelesaikan eksekusi perbaikan teknis perangkat komputer pengguna dan konfigurasi koneksi jaringan printer kantor."

  general:
    single:
      weekday:
        - "Mengikuti sesi briefing koordinasi teknis bersama pembimbing lapangan dan melaksanakan penugasan operasional harian. Melakukan pencatatan kendala teknis yang ditemukan serta penyusunan laporan progres kerja."
        - "Melaksanakan tugas operasional teknis harian sesuai dengan arahan pembimbing lapangan. Melakukan verifikasi hasil kerja serta penataan dokumen pendukung kegiatan magang."
    morning:
      weekday:
        - "Mengikuti sesi briefing koordinasi teknis pagi bersama tim pembimbing lapangan untuk pembagian target kerja harian."
    afternoon:
      weekday:
        - "Melaksanakan eksekusi teknis sesuai dengan pembagian tugas yang disepakati pada sesi pagi dan rekapitulasi hasil kerja."

